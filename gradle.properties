# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
minecraft_version=26.2
# Fabric Loader version
loader_version=0.19.3

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
mod_id=iamzombieq
# The human-readable display name for the mod.
mod_name=I Am Zombie?
# The license of the mod.
mod_license=MIT
# The mod version.
mod_version=1.0.1
# The group ID for the mod.
mod_group_id=dev.molang.iamzombieq

# Fabric API version - check https://modrinth.com/mod/fabric-api for the latest
fabric_version=0.156.0+26.2

# Cloth Config API version
cloth_config_version=26.2.155

# Cardinal Components API version
cardinal_components_version=8.0.1

# Minecraft version range
minecraft_version_range=>=26.2

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'maven-publish'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

repositories {
    // Repositories are defined in settings.gradle (dependencyResolutionManagement)
}

def findFirstNixLibraryDir = { String packageNamePart, String requiredFile ->
    def nixStore = file('/nix/store')
    if (!nixStore.isDirectory()) {
        return null
    }

    def matches = nixStore.listFiles({ File dir, String name ->
        name.contains(packageNamePart)
    } as FilenameFilter)
    if (matches == null) {
        return null
    }

    def match = matches.sort { it.name }.find { candidate ->
        new File(candidate, "lib/${requiredFile}").isFile()
    }

    return match == null ? null : new File(match, 'lib').absolutePath
}

def devClientLdLibraryPath = {
    def dirs = []
    def addDir = { String dir ->
        if (dir != null && file(dir).isDirectory() && !dirs.contains(dir)) {
            dirs.add(dir)
        }
    }

    addDir('/run/opengl-driver/lib')
    addDir(findFirstNixLibraryDir('libglvnd-', 'libGL.so.1'))
    addDir(findFirstNixLibraryDir('glibc-', 'ld-linux-x86-64.so.2'))
    addDir(findFirstNixLibraryDir('openal-soft-', 'libopenal.so.1'))
    addDir(findFirstNixLibraryDir('flite-', 'libflite.so'))
    addDir(findFirstNixLibraryDir('libx11-', 'libX11.so.6'))
    addDir(findFirstNixLibraryDir('libxext-', 'libXext.so.6'))
    addDir(findFirstNixLibraryDir('libxcursor-', 'libXcursor.so.1'))
    addDir(findFirstNixLibraryDir('libxrandr-', 'libXrandr.so.2'))
    addDir(findFirstNixLibraryDir('libxi-', 'libXi.so.6'))
    addDir(findFirstNixLibraryDir('libxxf86vm-', 'libXxf86vm.so.1'))
    addDir(findFirstNixLibraryDir('libxfixes-', 'libXfixes.so.3'))
    addDir(findFirstNixLibraryDir('libxrender-', 'libXrender.so.1'))
    addDir(findFirstNixLibraryDir('libxcb-', 'libxcb.so.1'))
    addDir(findFirstNixLibraryDir('libxau-', 'libXau.so.6'))
    addDir(findFirstNixLibraryDir('libxdmcp-', 'libXdmcp.so.6'))

    return dirs.join(':')
}.call()

def mergedDevClientLdLibraryPath = {
    def existing = System.getenv('LD_LIBRARY_PATH')
    return [devClientLdLibraryPath, existing].findAll { it != null && !it.isBlank() }.join(':')
}.call()

def configureDevClientRuntime = tasks.register('configureDevClientRuntime') {
    group = 'mod development'
    description = 'Applies local runtime tweaks needed by the development Minecraft client.'

    doLast {
        def fmlConfig = layout.projectDirectory.file('run/config/fml.toml').asFile
        fmlConfig.parentFile.mkdirs()

        if (fmlConfig.isFile()) {
            def text = fmlConfig.getText('UTF-8')
            if (text.contains('earlyWindowControl = true')) {
                fmlConfig.setText(text.replace('earlyWindowControl = true', 'earlyWindowControl = false'), 'UTF-8')
            } else if (!text.contains('earlyWindowControl = false')) {
                fmlConfig.append(System.lineSeparator() + 'earlyWindowControl = false' + System.lineSeparator(), 'UTF-8')
            }
        } else {
            fmlConfig.setText('# Local development override for NixOS/Wayland OpenGL startup.' + System.lineSeparator()
                    + 'earlyWindowControl = false' + System.lineSeparator(), 'UTF-8')
        }
    }
}

tasks.named('runClient').configure {
    dependsOn(configureDevClientRuntime)
}

def mergedLdLibPath = mergedDevClientLdLibraryPath
if (!mergedLdLibPath.isBlank()) {
    tasks.named('runClient').configure {
        environment 'LD_LIBRARY_PATH', mergedLdLibPath
    }
}

dependencies {
    // To change the versions see the gradle.properties
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config API (replaces NeoForge ModConfigSpec)
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Cardinal Components API (replaces NeoForge AttachmentType)
    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cardinal_components_version}"
    implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cardinal_components_version}"

    // Test dependencies
    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mod_id", project.mod_id
    inputs.property "mod_name", project.mod_name
    inputs.property "mod_license", project.mod_license
    inputs.property "minecraft_version_range", project.minecraft_version_range
    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "mod_id": project.mod_id,
                "mod_name": project.mod_name,
                "mod_license": project.mod_license,
                "minecraft_version_range": project.minecraft_version_range
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    // Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
